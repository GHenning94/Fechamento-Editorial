name: Publicar plugin

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Registrar versão e notas do commit
        run: node tools/write-changelog.js

      - run: npm ci
      - run: npm run build
      - run: node tools/package-ccx.js

      - name: Publicar arquivos do plugin
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: plugin-dist
          folder: dist
          force: true
          git-config-name: github-actions
          git-config-email: github-actions[bot]@users.noreply.github.com

      - name: Publicar release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PLUGIN_VERSION }}
          name: ${{ env.PLUGIN_TITLE }}
          body: ${{ env.PLUGIN_NOTES }}
          files: release/EditorialAutoClose.ccx
          make_latest: true
