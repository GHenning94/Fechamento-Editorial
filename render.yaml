services:
  - type: web
    name: fechamento-editorial
    runtime: node
    rootDir: tools/activation-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: license-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LICENSE_PUBLIC_KEY_B64
        sync: false
      - key: LICENSE_ADMIN_SECRET
        sync: false
      - key: USED_SERIALS_PATH
        value: /var/data/used-serials.json
